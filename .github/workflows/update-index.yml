name: Update episode index

# Rebuilds data/index.json when the clue dataset gets new commits (for example, new episodes
# or a new season), and commits it to main, which redeploys the site.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for dataset changes
        id: check
        run: |
          latest=$(git ls-remote https://github.com/jwolle1/jeopardy_clue_dataset refs/heads/main | cut -f1)
          current=$(node -p "require('./data/index.json').ref")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.changed == 'true'
        run: node scripts/build-index.mjs ${{ steps.check.outputs.latest }} && npm test
      - if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          git commit -m "Update episode index to dataset ${{ steps.check.outputs.latest }}"
          git push
